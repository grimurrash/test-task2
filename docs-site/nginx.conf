# Раздача собранной страницы документации. Порт 8082 — согласованная
# проджектом константа; переопределяется в compose пробросом порта, а не
# правкой этого файла.

server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/yaml;

    gzip on;
    gzip_types text/css application/javascript application/yaml text/html;
    gzip_min_length 1024;

    # Облачные функции Scalar (подсказки поиска, «Ask AI») выключены в сборке:
    # страница обязана работать без интернета. Клиент всё же дёргает их путь
    # на своём же хосте — отвечаем пустым 204, чтобы не сорить 404 в консоли.
    location /vector/ {
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Статика собирается заново при каждой сборке образа, версий в именах нет:
    # кэш держим коротким, иначе после пересборки контракта читатель увидит
    # вчерашнюю страницу.
    location ~* \.(js|css|yaml)$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }
}
