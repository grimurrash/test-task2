# Идемпотентный платёжный сервис — три части одной командой.
#
#   docker compose up          # поднять всё
#   docker compose down        # остановить
#
# Единственное предусловие у проверяющего — установленный Docker (R1).
#
# ─────────────────────────────────────────────────────────────────────────────
# Три сервиса — три РАЗНЫХ контекста сборки, и это не небрежность.
#
#   backend    → ./backend     своя папка
#   sandbox    → ./frontend    своя папка
#   docs       → .             корень репозитория
#
# Разница ровно в одном: кто читает контракт во время сборки. Документация
# собирается ИЗ `openapi/openapi.yaml` и токенов дизайна, поэтому ей нужен
# корень. Песочница контракт прочитала заранее — сгенерированные типы
# закоммичены в `frontend/src/api/schema.ts`, генерации внутри образа нет.
# Бэкенд контракт в образ не кладёт вовсе: он монтируется в цель тестов.
#
# Не «причёсывайте» это под один контекст: документация сломается.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── API ────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      # target не указан: цель runtime стоит в Dockerfile по умолчанию.
      # В ней нет ни devDependencies, ни исходников тестов — это требование R3,
      # и выполнено оно тем, что в рантайм-слой нечего положить, а не
      # аккуратностью сборки.
    image: psp-backend:local
    environment:
      PORT: 8080
    ports:
      # Порт хоста меняется одной переменной, без правки этого файла (R2):
      #   API_PORT=9000 docker compose up --build
      # Внутренний порт постоянный: на него смотрит HEALTHCHECK образа.
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  # ── Песочница ──────────────────────────────────────────────────────────────
  sandbox:
    build:
      context: ./frontend
      args:
        # Адрес API вшивается в бандл НА СБОРКЕ — Vite подставляет его в код,
        # рантайм-конфига у статики нет. Поэтому смена API_PORT требует
        # пересборки образа: `docker compose up --build`, а не просто `up`.
        # Без неё песочница молча продолжит стучаться на прежний порт, и в
        # браузере это выглядит как ошибка CORS — от обрыва сети неотличимо.
        # Написано в README, раздел «если не поднялось».
        VITE_API_BASE: "http://localhost:${API_PORT:-8080}"
    image: psp-sandbox:local
    ports:
      - "${SANDBOX_PORT:-8081}:8081"
    depends_on:
      backend:
        # Ждём не «контейнер запустился», а HEALTHCHECK бэкенда: песочница
        # без API поднимется, но первый же запрос из неё уйдёт в пустоту,
        # и проверяющий увидит немой экран вместо понятной ошибки.
        condition: service_healthy
    restart: unless-stopped

  # ── Документация ───────────────────────────────────────────────────────────
  docs:
    build:
      context: .                      # корень: сборка читает openapi/ и design/
      dockerfile: docs-site/Dockerfile
      args:
        # Симметрично песочнице: адрес API собирается из той же переменной
        # порта и вшивается на сборке. Документация показывает примеры команд
        # и настраивает свой рендер по этому адресу — без него они указывали
        # бы на умолчание, даже когда API поднят на другом порту.
        #
        # Ошибка здесь тихая, а не громкая: неизвестный build-аргумент Docker
        # встречает предупреждением, а не отказом. Сборка проходит, страница
        # открывается, и увидеть расхождение можно только сверив пример
        # с фактическим портом. Поэтому проверять — с переопределённым
        # API_PORT; на умолчании ошибка невидима.
        API_BASE: "http://localhost:${API_PORT:-8080}"
    image: psp-docs:local
    ports:
      - "${DOCS_PORT:-8082}:8082"
    restart: unless-stopped

  # ── Тесты бэкенда в контейнере (R4, A11) ───────────────────────────────────
  #
  #   docker compose run --rm backend-test
  #
  # Отдельный сервис, а не «тот же backend другой командой»: рантайм-образ
  # тестов не запустит по замыслу его автора — в нём нет ни devDependencies,
  # ни исходников тестов. Отсюда target: test.
  #
  # profiles держит его вне `docker compose up`: проверяющему он поднимается
  # по требованию, а не висит третьим контейнером.
  backend-test:
    build:
      context: ./backend
      target: test
    image: psp-backend-test:local
    environment:
      # Сверка покрытия требований (A4, задача #180) читает docs/product/PRD.md,
      # файл обоснований и тексты фронтовых тестов — всё это лежит вне backend/
      # и в образ не кладётся по той же причине, что и контракт. Путь передаётся
      # явно: без него сверка ищет корень подъёмом по каталогам и, не найдя,
      # падает с названной причиной, а не пропускает себя.
      REPO_ROOT: /app/repo
    volumes:
      # Контракт — общий артефакт репозитория, в образ бэкенда он намеренно
      # не кладётся. Тесты валидируют ответы против него, поэтому монтируется
      # только на чтение, по пути из OPENAPI_PATH образа.
      - ./openapi:/app/openapi:ro
      # Репозиторий целиком, только на чтение: требования и пометки на тестах —
      # такие же общие артефакты, как контракт. Образ от этого не меняется.
      - .:/app/repo:ro
    profiles: ["test"]
